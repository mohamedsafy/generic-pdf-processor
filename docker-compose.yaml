services:
  generic-pdf-processor:
    image: generic-pdf-processor
    build: 
      context: ./generic-pdf-processor
      target: prod
    ports:
      - 4000:4000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    