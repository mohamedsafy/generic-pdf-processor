services:
  generic-pdf-processor:
    image: generic-pdf-processor
    build: 
      context: ./generic-pdf-processor-python
      target: prod
    ports:
      - 4000:4000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/ping', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  frontend-react:
    image: frontend-react
    build: 
      context: ./frontend-react
      target: prod
    ports:
      - 80:80
    depends_on:
      generic-pdf-processor:
        condition: service_healthy
    
