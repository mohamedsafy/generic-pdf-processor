services:
  generic-pdf-processor:
    image: generic-pdf-processor
    build: 
      context: ./generic-pdf-processor-python
      target: dev
    ports:
      - 4000:4000
    volumes:
      - ./generic-pdf-processor-python:/app
  frontend-react:
    image: frontend-react
    build: 
      context: ./frontend-react
      target: dev
    ports:
      - 5173:5173
    volumes:
      - ./frontend-react/src:/usr/src/app/src
      - ./frontend-react/vite.config.js:/usr/src/app/vite.config.js
    