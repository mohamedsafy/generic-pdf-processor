[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "generic-pdf-processor-python"
version = "0.1.0"
description = "FastAPI service for processing PDF files."
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]==0.136.1",
    "pypdf==6.11.0",
    "reportlab==4.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff>=0.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
